name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 and 21
        # 26.x compiles on Java 25 (JAVA_HOME_25_X64); Gradle itself runs on 21, the last one listed.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all versions with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload jars (all versions and the plugin)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: justquests-${{ github.sha }}
          path: |
            neoforge/**/build/libs/*.jar
            fabric/**/build/libs/*.jar
            forge/**/build/libs/*.jar
            plugin/*/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          retention-days: 14
