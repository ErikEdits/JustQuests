# Discord Push Notification

```yaml
name: Discord Push Notification

on:
  push:

jobs:
  notify-discord:
    name: Send Push Notification to Discord
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          PUSHER: ${{ github.actor }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          payload=$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg sha "$COMMIT_SHA" \
            --arg message "$COMMIT_MESSAGE" \
            --arg commit_url "$COMMIT_URL" \
            --arg author "$AUTHOR" \
            --arg pusher "$PUSHER" \
            --arg repository_url "$REPOSITORY_URL" \
            '{
              username: "JustQuests GitHub",
              embeds: [
                {
                  title: "🚀 Neuer Push",
                  url: $commit_url,
                  description: $message,
                  color: 5763719,
                  fields: [
                    {
                      name: "📦 Repository",
                      value: $repository,
                      inline: true
                    },
                    {
                      name: "🌿 Branch",
                      value: $branch,
                      inline: true
                    },
                    {
                      name: "👤 Autor",
                      value: $author,
                      inline: true
                    },
                    {
                      name: "🔗 Commit",
                      value: ("[`" + ($sha[0:7]) + "`](" + $commit_url + ")"),
                      inline: true
                    },
                    {
                      name: "📤 Gepusht von",
                      value: $pusher,
                      inline: true
                    },
                    {
                      name: "📂 Repository",
                      value: ("[GitHub öffnen](" + $repository_url + ")"),
                      inline: true
                    }
                  ],
                  footer: {
                    text: "JustQuests • GitHub"
                  },
                  timestamp: (now | todateiso8601)
                }
              ]
            }')

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK"
```
