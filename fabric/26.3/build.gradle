plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
}

// --- per-version settings (the only part that differs between versions) ---
def mcVersion = '26.3'
def fabricLoader = '0.19.5'
def fabricApi = '0.161.0+26.3'

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_name}-fabric-${mcVersion}"
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${fabricLoader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    // permission checks for LuckPerms & co., bundled inside the jar
    include(implementation("me.lucko:fabric-permissions-api:0.7.0") {
        // its pom brings the Fabric API it was built against: keep the one of this version
        exclude group: 'net.fabricmc.fabric-api'
    })
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
