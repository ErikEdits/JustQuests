plugins {
    id 'fabric-loom' version '1.14.10'
}

// --- per-version settings (the only part that differs between versions) ---
def mcVersion = '1.21.7'
def fabricLoader = '0.19.3'
def fabricApi = '0.129.0+1.21.7'

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_name}-fabric-${mcVersion}"
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabricLoader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    // permission checks for LuckPerms & co., bundled inside the jar
    include(modImplementation("me.lucko:fabric-permissions-api:0.4.1"))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
